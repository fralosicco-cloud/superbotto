<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SuperBotto 🍀</title>
    <meta name="description" content="Gestione condivisa delle giocate del SuperEnalotto del gruppo">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SuperBotto">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
        .card-white { background-color: #ffffff; border: 1px solid #e2e8f0; }
        .ball {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .ball-sm {
            width: 26px;
            height: 26px;
            font-size: 0.75rem;
        }
        .ball-main { background: linear-gradient(135deg, #10B981, #047857); }
        .ball-star { background: linear-gradient(135deg, #F59E0B, #D97706); }
        .ball-drawn { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
        .ball-hit { background: linear-gradient(135deg, #EF4444, #B91C1C); border: 2px solid #FDE047; }
        header { padding-top: calc(1rem + env(safe-area-inset-top)) !important; }
        nav { padding-bottom: calc(0.625rem + env(safe-area-inset-bottom)) !important; }
    </style>
</head>
<body class="font-sans pb-24 bg-slate-100">

    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50 text-center max-w-md mx-auto">
        <div class="flex items-center justify-center gap-2">
            <h1 class="text-2xl font-black tracking-wide">SuperBotto</h1>
            <span class="text-xl">🍀</span>
        </div>
        <p class="text-xs text-emerald-100 mt-1 font-medium" id="header-subtitle">Caricamento dati...</p>
        <div class="text-[10px] text-emerald-100 font-bold mt-1" id="header-utente"></div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4" id="app-content">
        <div class="text-center py-10 text-slate-400 font-medium">⏳ Connessione al database...</div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around p-2.5 text-xs font-bold max-w-md mx-auto z-50 shadow-lg">
        <button onclick="navigate('bacheca')" class="flex flex-col items-center text-emerald-600 nav-btn" id="btn-bacheca">
            <span class="text-lg">🍀</span> Bacheca
        </button>
        <button onclick="navigate('cassa')" class="flex flex-col items-center text-slate-500 nav-btn" id="btn-cassa">
            <span class="text-lg">📊</span> Cassa
        </button>
        <button onclick="navigate('schedina')" class="flex flex-col items-center text-slate-500 nav-btn" id="btn-schedina">
            <span class="text-lg">🎰</span> Schedina
        </button>
        <button onclick="navigate('versamenti')" class="flex flex-col items-center text-slate-500 nav-btn" id="btn-versamenti">
            <span class="text-lg">💳</span> Versamenti
        </button>
    </nav>

    <div id="login-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
        <div class="card-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-xl">
            <div class="text-center space-y-1">
                <div class="text-3xl">🍀</div>
                <h2 class="font-black text-xl text-slate-800">Chi sei?</h2>
                <p class="text-xs text-slate-400">Accedi con il tuo nome per essere riconosciuto in bacheca</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-500 mb-1 block font-medium">Il tuo nome</label>
                    <select id="login-user" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800" required></select>
                </div>
                <div>
                    <label class="text-slate-500 mb-1 block font-medium">Password del gruppo</label>
                    <input type="password" id="login-pass" placeholder="Password" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800" required autocomplete="current-password" />
                </div>
                <div id="login-error" class="hidden text-rose-600 bg-rose-50 border border-rose-100 rounded-lg p-2 text-center"></div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">🍀 Entra</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://utywytptssixgpoyddbb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0eXd5dHB0c3NpeGdwb3lkZGJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzUyMzAsImV4cCI6MjEwNzIxMTIzMH0.ZOcxwtsY_wl7BJTrsjSCI7ceb8AuqD6u1ZwROEI2YEc";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentPage = 'bacheca';
        let state = {
            pin: "1234",
            startDate: "2026-10-08", // Data inizio giocate del gruppo
            users: ["Francesco", "Giovanni", "Franco", "Benny", "Beldo", "Beppe", "Disi", "Peps", "Massimo", "Igor"],
            schedina: { p1: [5, 12, 28, 41, 63, 88], star1: 15, p2: [9, 17, 33, 52, 70, 81], star2: 44 },
            versamenti: [],
            estrazioniManual: [], // Vincite/estrazioni verificate
            bacheca: [],
            ultimaEstrazione: null
        };

        // Dati delle giocate automatiche (gestiti dal server, NON salvati in Supabase)
        let autoData = { caricato: false, attiva: true, periodi: [], estrazioni: [], aggiornataIl: null };
        let lastAutoSnapshot = '';

        // ---------- Sessione del partecipante ----------
        let utente = null;
        try { utente = localStorage.getItem('sb_utente') || null; } catch (err) {}

        // ---------- Schedine: numeri, quantità (1-3) e costo ----------
        const COSTO_SCHEDINA = 1.50; // 6 numeri + SuperStar
        let editingSchedina = false;
        let editor = null;

        function numeroRandom() { return 1 + Math.floor(Math.random() * 90); }
        function numeriRandom(giaUsati) {
            const usati = new Set();
            for (const p of (giaUsati || [])) for (const n of (p.numeri || [])) usati.add(n);
            const numeri = [];
            while (numeri.length < 6) {
                const n = numeroRandom();
                if (!numeri.includes(n) && !usati.has(n)) numeri.push(n);
            }
            return numeri;
        }

        function schedinaValida(e) {
            return e && Array.isArray(e.schedine) && e.schedine.length > 0
                && Number.isInteger(e.num) && e.num >= 1 && e.num <= 3
                && (e.da === null || /^\d{4}-\d{2}-\d{2}$/.test(String(e.da)));
        }

        // Normalizza lo stato: la "storia schedine" sostituisce la vecchia schedina fissa.
        // datiDb = oggetto stato appena caricato da Supabase (per riconoscere i dati legacy)
        function normalizzaState(datiDb) {
            const storiaValida = Array.isArray(state.schedinaStoria) && state.schedinaStoria.some(schedinaValida);
            const legacyDaDb = datiDb && state.schedina && Array.isArray(state.schedina.p1) && !datiDb.schedinaStoria;
            if (!storiaValida || legacyDaDb) {
                const s = state.schedina || {};
                const schedine = [];
                if (Array.isArray(s.p1) && s.p1.length === 6) schedine.push({ numeri: s.p1.slice(), superstar: s.star1 != null ? Number(s.star1) : null });
                if (Array.isArray(s.p2) && s.p2.length === 6) schedine.push({ numeri: s.p2.slice(), superstar: s.star2 != null ? Number(s.star2) : null });
                while (schedine.length < 2) schedine.push({ numeri: numeriRandom(schedine), superstar: numeroRandom() });
                state.schedinaStoria = [{ da: null, num: 2, schedine }];
            } else {
                state.schedinaStoria = state.schedinaStoria.filter(schedinaValida);
            }
            delete state.schedina;
            state.schedinaStoria.sort((a, b) => (a.da === null ? -1 : b.da === null ? 1 : String(a.da).localeCompare(String(b.da))));
        }

        // Configurazione schedina in vigore alla data iso (la prima voce ha da=null = dall'inizio)
        function configSchedinaA(iso) {
            const storia = Array.isArray(state.schedinaStoria) ? state.schedinaStoria : [];
            let cfg = storia.find(e => e.da === null) || storia[0];
            for (const e of storia) { if (e.da !== null && e.da <= iso) cfg = e; }
            return cfg;
        }
        function schedinaCorrente() { return configSchedinaA(romeNowInfo().iso); }
        function schedineAttiveA(iso) {
            const c = configSchedinaA(iso);
            return ((c && c.schedine) || []).slice(0, (c && c.num) || 2);
        }
        function numeriSchedinaA(iso) {
            return schedineAttiveA(iso).flatMap(p => p.numeri || []);
        }
        normalizzaState();

        // ---------- Utilità date (fuso Europe/Rome) ----------
        function romeNowInfo() {
            const parts = {};
            const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
            for (const p of fmt.formatToParts(new Date())) {
                if (p.type !== 'literal') parts[p.type] = p.value;
            }
            return { iso: `${parts.year}-${parts.month}-${parts.day}`, hhmm: `${parts.hour}:${parts.minute}` };
        }
        function shiftISO(iso, days) {
            const d = new Date(iso + 'T12:00:00Z');
            d.setUTCDate(d.getUTCDate() + days);
            return d.toISOString().slice(0, 10);
        }
        function isoToIt(iso) {
            const p = iso.split('-');
            return `${Number(p[2])}/${Number(p[1])}/${p[0]}`;
        }
        function itToISO(data) {
            const m = data.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!m) return null;
            return `${m[3]}-${String(Number(m[2])).padStart(2, '0')}-${String(Number(m[1])).padStart(2, '0')}`;
        }
        function weekdayOfISO(iso) {
            return new Date(iso + 'T12:00:00Z').getUTCDay();
        }
        const GIORNI_ESTRAZIONE = [2, 4, 5, 6]; // Martedì, Giovedì, Venerdì, Sabato

        // Carica lo stato delle giocate automatiche dal server e ricarica la pagina se cambiato
        async function loadAuto() {
            try {
                const res = await fetch('/api/estrazioni-auto', { cache: 'no-store' });
                if (!res.ok) return;
                const data = await res.json();
                autoData = {
                    caricato: true,
                    attiva: !!data.attiva,
                    periodi: Array.isArray(data.periodi) ? data.periodi : [],
                    estrazioni: Array.isArray(data.estrazioni) ? data.estrazioni : [],
                    aggiornataIl: data.aggiornataIl || null
                };
                const snap = JSON.stringify([autoData.attiva, autoData.periodi, autoData.estrazioni.length, autoData.estrazioni[0] && autoData.estrazioni[0].data]);
                if (snap !== lastAutoSnapshot) {
                    renderCurrentPage();
                }
                lastAutoSnapshot = snap;
            } catch (err) { /* Riproverà al prossimo controllo */ }
        }
        setInterval(loadAuto, 60000);

        // Ultima estrazione nota: la più recente tra quella registrata automaticamente e quella manuale
        function getUltimaEstrazione() {
            const auto = (autoData.estrazioni || [])[0] || null;
            const manuale = state.ultimaEstrazione || null;
            if (auto && manuale) {
                const a = itToISO(auto.data), m = itToISO(manuale.data);
                if (a && m) return a >= m ? auto : manuale;
            }
            return auto || manuale;
        }

        // Prossimo aggiornamento automatico programmato (21:00 del prossimo giorno di estrazione)
        function prossimoAggiornamento() {
            if (!autoData.caricato || !autoData.attiva) return null;
            const now = romeNowInfo();
            for (let i = 0; i < 9; i++) {
                const iso = shiftISO(now.iso, i);
                if (!GIORNI_ESTRAZIONE.includes(weekdayOfISO(iso))) continue;
                if (i === 0 && now.hhmm >= '21:00') continue;
                return { iso, testo: `${isoToIt(iso)} alle 21:00` };
            }
            return null;
        }

        // Genera automaticamente i giorni di estrazione (Martedì=2, Giovedì=4, Venerdì=5, Sabato=6),
        // limitati ai periodi in cui le giocate automatiche sono attive
        function getAutomaticDraws() {
            const draws = [];
            const seen = new Set();
            const startISO = state.startDate || "2026-10-01";
            const oggiISO = romeNowInfo().iso;

            let segmenti = [];
            if (autoData.caricato && autoData.periodi.length > 0) {
                for (const p of autoData.periodi) {
                    const da = p.da || startISO;
                    const al = p.al || oggiISO;
                    if (da <= al) segmenti.push({ da, al });
                }
            } else {
                // Dati automatici non ancora caricati: comportamento precedente
                segmenti.push({ da: startISO, al: oggiISO });
            }

            for (const seg of segmenti) {
                const t = new Date(seg.da + 'T12:00:00Z');
                const end = new Date(seg.al + 'T12:00:00Z');
                while (t <= end) {
                    const iso = t.toISOString().slice(0, 10);
                    if (GIORNI_ESTRAZIONE.includes(t.getUTCDay()) && !seen.has(iso)) {
                        seen.add(iso);
                        const dataIt = isoToIt(iso);
                        // Cerca se esiste una vincita o esito registrato per questa data
                        const custom = (state.estrazioniManual || []).find(e => e.data === dataIt);
                        const online = (autoData.estrazioni || []).find(e => e.data === dataIt);
                        const cfgSchedina = configSchedinaA(iso);
                        draws.push({
                            id: t.getTime(),
                            data: dataIt,
                            iso,
                            costo: ((cfgSchedina && cfgSchedina.num) || 2) * COSTO_SCHEDINA,
                            vincita: custom ? custom.vincita : 0,
                            numeri: custom && custom.numeri ? custom.numeri : (online ? online.numeri : null),
                            superstar: custom && custom.superstar != null ? custom.superstar : (online ? online.superstar : null)
                        });
                    }
                    t.setUTCDate(t.getUTCDate() + 1);
                }
            }
            return draws;
        }

        async function initDatabase() {
            const { data, error } = await supabaseClient
                .from('app_state')
                .select('data')
                .eq('id', 'main_db')
                .single();

            if (data && data.data) {
                state = { ...state, ...data.data };
                normalizzaState(data.data);
                verificaSessione();
                renderCurrentPage();
            } else if (error) {
                console.error("Errore caricamento da Supabase:", error);
            }

            supabaseClient
                .channel('public:app_state')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state' }, payload => {
                    if (payload.new && payload.new.data) {
                        state = { ...state, ...payload.new.data };
                        normalizzaState(payload.new.data);
                        verificaSessione();
                        renderCurrentPage();
                    }
                })
                .subscribe();
        }

        async function saveState() {
            renderCurrentPage();
            const { error } = await supabaseClient
                .from('app_state')
                .update({ data: state, updated_at: new Date().toISOString() })
                .eq('id', 'main_db');

            if (error) {
                alert("Errore durante il salvataggio in rete!");
                console.error(error);
            }
        }

        function calculateMetrics() {
            const allDraws = getAutomaticDraws();
            const numUsers = state.users.length || 1;
            const totalDraws = allDraws.length;
            const totalSpesi = allDraws.reduce((sum, e) => sum + (parseFloat(e.costo) || 0), 0);
            const totalCostPerUser = totalSpesi / numUsers;

            const corrente = schedinaCorrente();
            const numSchedine = (corrente && corrente.num) || 2;
            const costoEstrazione = numSchedine * COSTO_SCHEDINA;
            const costPerDraw = costoEstrazione / numUsers;

            const totalVersato = state.versamenti.reduce((sum, v) => sum + (parseFloat(v.importo) || 0), 0);
            const totalVincite = allDraws.reduce((sum, e) => sum + (parseFloat(e.vincita) || 0), 0);
            const winPerUser = totalVincite / numUsers;

            const cassaComune = totalVersato - totalSpesi + totalVincite;

            const saldi = state.users.map(user => {
                const totalPaid = state.versamenti
                    .filter(v => v.user === user)
                    .reduce((sum, v) => sum + (parseFloat(v.importo) || 0), 0);
                
                const saldo = totalPaid - totalCostPerUser + winPerUser;
                return { user, totalPaid, saldo };
            });

            return {
                cassaComune: cassaComune < 0 ? 0 : cassaComune,
                totalVersato,
                totalVincite,
                totalDraws,
                totalSpesi,
                numUsers,
                numSchedine,
                costoEstrazione,
                costPerDraw,
                saldi,
                allDraws
            };
        }

        function updateHeaderSubtitle() {
            const m = calculateMetrics();
            const sub = document.getElementById('header-subtitle');
            if (sub) {
                sub.innerText = `${m.numUsers} Colleghi • ${m.numSchedine} Schedine • ${m.costPerDraw.toFixed(2)}€ ad estrazione`;
            }
            const uh = document.getElementById('header-utente');
            if (uh) {
                uh.innerHTML = utente
                    ? `Ciao, <strong>${utente}</strong> · <span onclick="esciLogin()" class="underline cursor-pointer opacity-80 hover:opacity-100">esci</span>`
                    : '';
            }
        }

        function navigate(page) {
            currentPage = page;
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-emerald-600');
                b.classList.add('text-slate-500');
            });
            const activeBtn = document.getElementById('btn-' + page);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-500');
                activeBtn.classList.add('text-emerald-600');
            }
            renderCurrentPage();
        }

        function renderCurrentPage() {
            const content = document.getElementById('app-content');
            if (currentPage === 'bacheca') content.innerHTML = renderBacheca();
            if (currentPage === 'cassa') content.innerHTML = renderCassa();
            if (currentPage === 'schedina') content.innerHTML = renderSchedina();
            if (currentPage === 'versamenti') content.innerHTML = renderVersamenti();
            updateHeaderSubtitle();
        }

        function renderBacheca() {
            const m = calculateMetrics();
            return `
                <div class="grid grid-cols-2 gap-3">
                    <div class="card-white p-4 rounded-2xl flex flex-col justify-between h-32 relative shadow-sm">
                        <div class="flex justify-between items-start text-slate-500"><span class="text-xs font-bold uppercase">Cassa<br>comune</span><span>👛</span></div>
                        <div><div class="text-2xl font-black text-emerald-600">€ ${m.cassaComune.toFixed(2)}</div><div class="text-[11px] text-slate-400">disponibile</div></div>
                    </div>
                    <div class="card-white p-4 rounded-2xl flex flex-col justify-between h-32 relative shadow-sm">
                        <div class="flex justify-between items-start text-slate-500"><span class="text-xs font-bold uppercase">Vincite totali</span><span>🏆</span></div>
                        <div><div class="text-2xl font-black text-amber-500">€ ${m.totalVincite.toFixed(2)}</div><div class="text-[11px] text-slate-400">totali</div></div>
                    </div>
                    <div class="card-white p-4 rounded-2xl flex flex-col justify-between h-32 relative shadow-sm">
                        <div class="flex justify-between items-start text-slate-500"><span class="text-xs font-bold uppercase">Giocate</span><span>📈</span></div>
                        <div><div class="text-2xl font-black text-slate-800">${m.totalDraws}</div><div class="text-[11px] text-slate-400">estrazioni giocate</div></div>
                    </div>
                    <div class="card-white p-4 rounded-2xl flex flex-col justify-between h-32 relative shadow-sm">
                        <div class="flex justify-between items-start text-slate-500"><span class="text-xs font-bold uppercase">Soldi spesi</span><span>💸</span></div>
                        <div><div class="text-2xl font-black text-slate-700">€ ${m.totalSpesi.toFixed(2)}</div><div class="text-[11px] text-slate-400">schedine</div></div>
                    </div>
                </div>

                <div class="card-white p-4 rounded-2xl space-y-3 shadow-sm">
                    <h2 class="font-bold text-sm text-slate-800 flex items-center gap-1.5"><span>🍀</span> Bacheca del Gruppo</h2>
                    <form onsubmit="handlePost(event)" class="flex gap-2">
                        <input type="text" id="b-msg" placeholder="Scrivi un messaggio al gruppo..." class="flex-1 bg-slate-50 border border-slate-200 text-slate-800 text-xs p-2.5 rounded-xl focus:outline-none focus:border-emerald-500" required />
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-4 font-bold rounded-xl shadow transition">Invia</button>
                    </form>
                    <div class="space-y-2 pt-1">
                        ${state.bacheca.length === 0 ? '<div class="text-center text-xs text-slate-400 py-2">Nessun messaggio in bacheca</div>' : state.bacheca.map(b => `
                            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs space-y-1">
                                <div class="flex justify-between text-[11px] font-bold"><span class="${state.users.includes(b.user) ? 'text-emerald-600' : 'text-slate-400'}">${b.user}</span><span class="text-slate-400 font-medium">${b.data}</span></div>
                                <div class="text-slate-700 leading-relaxed">${b.testo}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCassa() {
            const m = calculateMetrics();
            return `
                <div class="card-white p-5 rounded-2xl text-center shadow-sm border border-slate-200 space-y-1">
                    <span class="text-xs uppercase tracking-wider font-extrabold text-slate-400">Cassa Comune Disponibile</span>
                    <div class="text-3xl font-black text-emerald-600 mt-1">€ ${m.cassaComune.toFixed(2)}</div>
                    <div class="text-[11px] text-slate-400 pt-1">Versati: ${m.totalVersato.toFixed(2)}€ • Spesi: ${m.totalSpesi.toFixed(2)}€ • Vinti: ${m.totalVincite.toFixed(2)}€</div>
                </div>

                <div class="card-white rounded-2xl overflow-hidden shadow-sm">
                    <div class="p-3.5 bg-slate-50 border-b border-slate-100 flex justify-between items-center text-xs font-bold text-slate-700">
                        <span class="text-sm font-bold">Saldi Partecipanti (${m.numUsers})</span>
                        <span class="text-slate-400">Quota: ${m.costPerDraw.toFixed(2)}€/estrazione</span>
                    </div>
                    <div class="divide-y divide-slate-100">
                        ${m.saldi.map(s => `

        // ---------- Editor schedine (riservato al Cassiere) ----------
        function apriEditorSchedina() {
            const pin = prompt('Inserisci il PIN Cassiere:');
            if (pin === null) return;
            if (pin !== state.pin) return alert('PIN Errato!');
            const corrente = schedinaCorrente();
            editor = {
                num: corrente.num || 2,
                schedine: (corrente.schedine || []).map(p => ({ numeri: [...(p.numeri || [])], superstar: p.superstar }))
            };
            editingSchedina = true;
            renderCurrentPage();
        }

        function annullaEditorSchedina() {
            editingSchedina = false;
            editor = null;
            renderCurrentPage();
        }

        function editorNum(n) {
            if (!editor) return;
            editor.num = n;
            while (editor.schedine.length < n) {
                editor.schedine.push({ numeri: numeriRandom(editor.schedine), superstar: numeroRandom() });
            }
            renderCurrentPage();
        }

        function editorAggiorna(i, j, valore) {
            if (!editor || !editor.schedine[i]) return;
            const n = parseInt(valore, 10);
            editor.schedine[i].numeri[j] = isNaN(n) ? null : n;
        }

        function editorAggiornaStar(i, valore) {
            if (!editor || !editor.schedine[i]) return;
            const n = parseInt(valore, 10);
            editor.schedine[i].superstar = isNaN(n) ? null : n;
        }

        function renderEditorSchedina() {
            const totale = (editor.num * COSTO_SCHEDINA).toFixed(2).replace('.', ',');
            const btnNum = n => `<button onclick="editorNum(${n})" class="flex-1 font-bold py-2.5 rounded-xl border transition text-sm ${editor.num === n ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">${n}</button>`;
            const pannelli = [];
            for (let i = 0; i < editor.num; i++) {
                const p = editor.schedine[i] || { numeri: [], superstar: null };
                pannelli.push(`
                    <div class="space-y-2">
                        <span class="text-xs font-bold text-slate-400 block">Schedina ${i + 1}</span>
                        <div class="grid grid-cols-7 gap-1.5">
                            ${p.numeri.map((n, j) => `<input type="number" min="1" max="90" inputmode="numeric" value="${n != null ? n : ''}" oninput="editorAggiorna(${i}, ${j}, this.value)" class="w-full p-1.5 bg-slate-50 border border-slate-200 rounded-lg text-center text-slate-800 font-bold text-sm" />`).join('')}
                            <input type="number" min="1" max="90" inputmode="numeric" value="${p.superstar != null ? p.superstar : ''}" oninput="editorAggiornaStar(${i}, this.value)" class="w-full p-1.5 bg-amber-50 border border-amber-200 rounded-lg text-center text-slate-800 font-bold text-sm" />
                        </div>
                    </div>
                `);
            }
            return `
                <div class="card-white p-5 rounded-2xl space-y-4 shadow-sm border border-emerald-200">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <h2 class="font-bold text-xl text-slate-800">✏️ Modifica Schedine</h2>
                        <span class="text-[10px] text-slate-400 font-bold uppercase">Cassiere</span>
                    </div>
                    <div class="space-y-2">
                        <span class="text-xs font-bold text-slate-500 block">Quante schedine giocare? <span class="text-slate-400 font-medium">(1,50€ ciascuna)</span></span>
                        <div class="flex gap-2">${[1, 2, 3].map(btnNum).join('')}</div>
                    </div>
                    ${pannelli.join('')}
                    <div class="text-[11px] text-slate-500 bg-slate-50 border border-slate-100 rounded-xl p-2.5">💶 Totale: <strong>${editor.num} × 1,50€ = ${totale}€</strong> ad estrazione</div>
                    <div class="text-[10px] text-slate-400">Le modifiche valgono dalla prossima estrazione: se fatte dopo le 20:30, dalla giocata successiva.</div>
                    <div class="flex gap-2">
                        <button onclick="salvaEditorSchedina()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition text-xs">💾 Salva modifiche</button>
                        <button onclick="annullaEditorSchedina()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 px-4 rounded-xl border border-slate-200 transition text-xs">Annulla</button>
                    </div>
                </div>
            `;
        }

        function salvaEditorSchedina() {
            if (!editor) return;
            for (let i = 0; i < editor.num; i++) {
                const p = editor.schedine[i] || { numeri: [], superstar: null };
                const numeri = p.numeri || [];
                const numeriOk = numeri.length === 6 && numeri.every(n => Number.isInteger(n) && n >= 1 && n <= 90) && new Set(numeri).size === 6;
                if (!numeriOk) return alert(`La schedina ${i + 1} deve contenere 6 numeri diversi compresi tra 1 e 90.`);
                if (!(Number.isInteger(p.superstar) && p.superstar >= 1 && p.superstar <= 90)) return alert(`Il numero SuperStar della schedina ${i + 1} deve essere compreso tra 1 e 90.`);
            }
            const ora = romeNowInfo();
            const da = ora.hhmm >= '20:30' ? shiftISO(ora.iso, 1) : ora.iso;
            state.schedinaStoria = state.schedinaStoria.filter(e => e.da !== da);
            state.schedinaStoria.push({
                da,
                num: editor.num,
                schedine: editor.schedine.map(p => ({ numeri: [...p.numeri], superstar: p.superstar }))
            });
            state.schedinaStoria.sort((a, b) => (a.da === null ? -1 : b.da === null ? 1 : String(a.da).localeCompare(String(b.da))));
            editingSchedina = false;
            editor = null;
            saveState();
        }

                        <div><label class="text-slate-500 mb-1 block font-medium">Importo (€)</label><input type="number" step="0.50" id="v-importo" placeholder="Importo (€)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800" required /></div>
                        <div><label class="text-slate-500 mb-1 block font-medium">Metodo di Pagamento</label><select id="v-metodo" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800"><option>Contanti</option><option>PayPal</option><option>Satispay</option></select></div>
                        <div><label class="text-slate-500 mb-1 block font-medium">PIN Cassiere</label><input type="password" id="v-pin" placeholder="PIN Segreto" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800" required /></div>

                    <div class="divide-y divide-slate-100 text-xs">

                            <div class="p-3.5 flex justify-between items-center">
                                <div><span class="font-bold text-slate-800 text-sm block">${v.user}</span><span class="text-[10px] text-slate-400">${v.data} • Metodo: ${v.metodo || 'Contanti'}</span></div>
                                <span class="font-black text-emerald-600 text-sm bg-emerald-50 px-2.5 py-1 rounded-lg">+ € ${parseFloat(v.importo).toFixed(2)}</span>

        function handleAddUser(e) {
            e.preventDefault();
            const name = document.getElementById('new-username').value.trim();
            if (!name || state.users.includes(name)) return;
            state.users.push(name);
            saveState();
        }

        function handleRemoveUser(userName) {
            const pin = prompt('Inserisci il PIN Cassiere:');
            if (pin !== state.pin) return alert('PIN Errato!');
            state.users = state.users.filter(u => u !== userName);
            saveState();
        }

        function handleRegistraVincita(e) {
            e.preventDefault();
            const pin = document.getElementById('vincita-pin').value;
            if (pin !== state.pin) return alert('PIN Errato!');
            const importo = parseFloat(document.getElementById('vincita-importo').value);
            if (!state.estrazioniManual) state.estrazioniManual = [];
            state.estrazioniManual.push({ id: Date.now(), data: new Date().toLocaleDateString('it-IT'), vincita: importo });
            saveState();
        }

        function handleVersamento(e) {
            e.preventDefault();
            const pin = document.getElementById('v-pin').value;
            if (pin !== state.pin) return alert('PIN Errato!');
            const user = document.getElementById('v-user').value;
            const importo = parseFloat(document.getElementById('v-importo').value);
            const metodo = document.getElementById('v-metodo').value;
            state.versamenti.push({ id: Date.now(), user, importo, data: new Date().toLocaleDateString('it-IT'), metodo });
            saveState();
        }

        function handlePost(e) {
            e.preventDefault();
            if (!utente) { apriLogin(); return; }
            const testo = document.getElementById('b-msg').value;
            state.bacheca.unshift({ user: utente, testo, data: new Date().toLocaleDateString('it-IT') });
            saveState();
        }

        // ---------- Accesso partecipanti ----------
        function apriLogin() {
            const sel = document.getElementById('login-user');
            if (sel) {
                const precedente = sel.value;
                sel.innerHTML = state.users.map(u => `<option value="${u}">${u}</option>`).join('');
                if (precedente && state.users.includes(precedente)) sel.value = precedente;
            }
            const ov = document.getElementById('login-overlay');
            if (ov) { ov.classList.remove('hidden'); ov.classList.add('flex'); }
        }

        function chiudiOverlayLogin() {
            const ov = document.getElementById('login-overlay');
            if (ov) { ov.classList.add('hidden'); ov.classList.remove('flex'); }
            const pass = document.getElementById('login-pass');
            if (pass) pass.value = '';
            const err = document.getElementById('login-error');
            if (err) err.classList.add('hidden');
        }

        function verificaSessione() {
            if (utente && !state.users.includes(utente)) {
                // Il partecipante è stato rimosso dal gruppo: sessione non più valida
                utente = null;
                try { localStorage.removeItem('sb_utente'); } catch (err) {}
            }
            if (utente) {
                chiudiOverlayLogin();
            } else {
                apriLogin();
            }
        }

        function esciLogin() {
            utente = null;
            try { localStorage.removeItem('sb_utente'); } catch (err) {}
            verificaSessione();
            renderCurrentPage();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const nome = document.getElementById('login-user').value;
            const password = document.getElementById('login-pass').value;
            const errBox = document.getElementById('login-error');
            const btn = e.target.querySelector('button[type="submit"]');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Accesso...'; }
            if (errBox) errBox.classList.add('hidden');
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, password })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.ok) {
                    utente = nome;
                    try { localStorage.setItem('sb_utente', nome); } catch (err) {}
                    chiudiOverlayLogin();
                    renderCurrentPage();
                    return;
                }
                if (errBox) {
                    errBox.textContent = data.error || 'Accesso non riuscito.';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                if (errBox) {
                    errBox.textContent = 'Impossibile contattare il server. Riprova.';
                    errBox.classList.remove('hidden');
                }
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '🍀 Entra'; }
            }
        }

        async function controlloAutomatico() {
            const btn = document.getElementById('btn-fetch');
            if(btn) btn.innerText = "⏳ Controllo...";
            try {
                const res = await fetch('/api/estrazione');
                if (res.ok) {
                    const data = await res.json();
                    const e = data.estrazioni && data.estrazioni[0];
                    if (e && e.numeri && e.numeri.length >= 6) {
                        state.ultimaEstrazione = { data: e.data, numeri: e.numeri.map(Number), superstar: e.superstar != null ? Number(e.superstar) : null };
                        saveState();
                        loadAuto();
                        return;
                    }
                }
            } catch (err) {}
            if(btn) btn.innerText = "🔄 Riprova";
            alert("Impossibile controllare l'estrazione online. Riprova tra poco.");
        }

        // Ferma o riattiva le giocate automatiche (richiede PIN Cassiere)
        async function toggleAutoGiocate(attiva) {
            const pin = prompt('Inserisci il PIN Cassiere:');
            if (pin === null) return;
            if (pin !== state.pin) return alert('PIN Errato!');
            try {
                const res = await fetch('/api/estrazioni-auto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ attiva })
                });
                if (!res.ok) throw new Error('errore server');
                const data = await res.json();
                autoData = {
                    caricato: true,
                    attiva: !!data.attiva,
                    periodi: Array.isArray(data.periodi) ? data.periodi : [],
                    estrazioni: Array.isArray(data.estrazioni) ? data.estrazioni : [],
                    aggiornataIl: data.aggiornataIl || null
                };
                lastAutoSnapshot = JSON.stringify([autoData.attiva, autoData.periodi, autoData.estrazioni.length, autoData.estrazioni[0] && autoData.estrazioni[0].data]);
                renderCurrentPage();
            } catch (err) {
                alert("Impossibile aggiornare le giocate automatiche. Riprova.");
            }
        }

        function renderAutoGiocateCard() {
            const caricato = autoData.caricato;
            const attiva = caricato ? autoData.attiva : true;
            const ultimo = (autoData.estrazioni || [])[0];
            const prossimo = prossimoAggiornamento();

            let statoHtml, bottoneHtml;
            if (!caricato) {
                statoHtml = '<span class="text-slate-400 font-black">CARICAMENTO...</span>';
                bottoneHtml = '';
            } else if (attiva) {
                statoHtml = '<span class="text-emerald-600 font-black">ATTIVE</span> 🟢';
                bottoneHtml = '<button onclick="toggleAutoGiocate(false)" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold py-2.5 rounded-xl shadow-sm transition text-xs">⏸ Ferma le giocate automatiche</button>';
            } else {
                statoHtml = '<span class="text-rose-600 font-black">FERMATE</span> 🔴';
                bottoneHtml = '<button onclick="toggleAutoGiocate(true)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition text-xs">▶️ Riattiva le giocate automatiche</button>';
            }

            return `
                <div class="card-white p-5 rounded-2xl space-y-3 shadow-sm border border-blue-100">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-sm text-slate-800 flex items-center gap-1.5"><span>⚙️</span> Giocate Automatiche</h3>
                        ${statoHtml}
                    </div>
                    <div class="text-xs text-slate-600 space-y-1.5 leading-relaxed">
                        <div class="flex items-start gap-2"><span>🗓️</span><span>Aggiornamento automatico dei risultati: <strong>martedì, giovedì, venerdì e sabato alle 21:00</strong>.</span></div>
                        ${attiva && prossimo ? `<div class="flex items-start gap-2"><span>⏰</span><span>Prossimo aggiornamento: <strong>${prossimo.testo}</strong></span></div>` : ''}
                        ${ultimo ? `<div class="flex items-start gap-2"><span>✅</span><span>Ultimo risultato registrato: <strong>${ultimo.data}</strong></span></div>` : ''}
                        ${!attiva ? '<div class="text-rose-500 bg-rose-50 border border-rose-100 rounded-lg p-2">Le giocate sono sospese: nessuna nuova estrazione viene conteggiata in cassa.</div>' : ''}
                    </div>
                    ${bottoneHtml}
                    <div class="text-[10px] text-slate-400">Fermare prima delle 20:30 esclude dal conteggio la giocata di quella sera.</div>
                </div>
            `;
        }

        initDatabase();
        loadAuto();
        verificaSessione();

        // PWA: registra il service worker per funzionare come app installata (anche offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
